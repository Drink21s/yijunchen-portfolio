# ============================================================
# 易俊臣个人网站 · Nginx 配置
# 使用方法见 docs/部署指南.md
#   1. 把本文件上传到服务器： /etc/nginx/sites-available/yijunchen
#   2. 软链接启用：  sudo ln -s /etc/nginx/sites-available/yijunchen /etc/nginx/sites-enabled/
#   3. 检查并重载：  sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;

    # 有域名就写域名；只有 IP 就把这里改成你的公网 IP（或者写成 _）
    server_name _;

    # 网页文件所在的目录（scp 上传的目标位置）
    root /var/www/yijunchen;
    index index.html;

    # 字符集，防止中文乱码
    charset utf-8;

    # 自定义 404 页面
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 静态文件：先找文件，再找目录，最后回 404（这是纯静态站点，不做 SPA 回退）
    location / {
        try_files $uri $uri/ =404;
    }

    # 文档目录不在网站上公开访问
    location /docs/ {
        return 404;
    }

    # 图片：缓存 30 天
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # CSS / JS：缓存 7 天
    location ~* \.(css|js)$ {
        expires 7d;
        try_files $uri =404;
    }

    # 隐藏文件（.git、.env 等）一律不允许访问 —— 重要！
    location ~ /\. {
        deny all;
        return 404;
    }

    # 简单的安全响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # 访问日志（排错时看这里）
    access_log /var/log/nginx/yijunchen.access.log;
    error_log  /var/log/nginx/yijunchen.error.log;

    # 压缩，让手机访问更快
    gzip on;
    gzip_types text/plain text/css application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
}

